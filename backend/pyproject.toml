[project]
name = "fastapi-admin-backend"
version = "0.1.0"
description = "FastAPI backend for the admin frontend"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.2.0",
  "fastembed>=0.7.1",
  "fastapi>=0.116.0",
  "itsdangerous>=2.2.0",
  "minio>=7.2.7",
  "openai>=1.76.0",
  "pillow>=12.0.0",
  "pydantic-settings>=2.10.0",
  "pypdf>=5.4.0",
  "psycopg[binary]>=3.2.9",
  "python-multipart>=0.0.20",
  "qdrant-client>=1.17.1",
  "rapidocr-onnxruntime>=1.4.4",
  "redis>=5.2.1",
  "scalar-fastapi>=1.8.2",
  "sqlalchemy>=2.0.40",
  "uvicorn[standard]>=0.35.0",
]

[tool.uv]
package = false
