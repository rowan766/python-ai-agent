[project]
name = "fastapi-admin-backend"
version = "0.1.0"
description = "FastAPI backend for the admin frontend"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.2.0",
  "fastapi>=0.116.0",
  "itsdangerous>=2.2.0",
  "pydantic-settings>=2.10.0",
  "psycopg[binary]>=3.2.9",
  "python-multipart>=0.0.20",
  "scalar-fastapi>=1.8.2",
  "sqlalchemy>=2.0.40",
  "uvicorn[standard]>=0.35.0",
]

[tool.uv]
package = false
