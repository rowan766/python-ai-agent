services:
  backend:
    build:
      context: ./backend
    container_name: fastapi-admin-backend
    ports:
      - "3101:3101"
    env_file:
      - ./backend/.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3101
      DATABASE_URL: postgresql+psycopg://admin:password123@postgres:5432/admin_system
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_CONSOLE_URL: http://127.0.0.1:9001
      QDRANT_URL: http://qdrant:6333
      DOCUMENT_PROCESSING_MODE: worker
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 3101
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  document-worker:
    build:
      context: ./backend
    container_name: fastapi-admin-document-worker
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://admin:password123@postgres:5432/admin_system
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_CONSOLE_URL: http://127.0.0.1:9001
      QDRANT_URL: http://qdrant:6333
      DOCUMENT_PROCESSING_MODE: worker
    command: python -m app.workers.document_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  # 向量数据库 - 存储文档的语义向量，用于 RAG 检索
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Redis - 存储对话历史（多轮聊天记忆）和会话 token
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # 开启持久化，重启不丢数据
    restart: unless-stopped

  # MinIO - 企业级对象存储，用于上传文件、附件与后续预处理产物
  minio:
    image: pgsty/silo:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # PostgreSQL - 存储用户信息、登录凭证、知识库元数据
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: admin_system
    volumes:
      - admin_system_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin_system"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  minio_data:
  admin_system_postgres_data:
